# Gateway routes for the orders service.
# Format and rules: https://github.com/likhith5697/platform-templates (schema/route.schema.json)
routes:
  - name: orders-create
    path: /orders
    method: POST
    namespace: orders
    service: orders
    port: 8080
    auth: custom

  - name: orders-list
    path: /orders
    method: GET
    namespace: orders
    service: orders
    port: 8080
    auth: custom

  - name: orders-get
    path: /orders/{id}
    method: GET
    namespace: orders
    service: orders
    port: 8080
    auth: custom
